[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memoire-ai"
version = "0.1.0"
description = "Persistent causal project memory for AI coding assistants"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
keywords = ["claude", "cursor", "windsurf", "codex", "gemini", "ai", "memory", "mcp", "developer-tools", "knowledge-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "surrealdb>=2.0.0",
    "watchdog>=6.0.0",
    "mcp>=1.0.0",
    "click>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
memoire = "memoire.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-material-extensions>=1.3.0",
]
pdf = [
    "pypdf>=4.0.0",
    "Pillow>=10.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["memoire*"]
