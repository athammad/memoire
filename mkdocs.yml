site_name: memoire
site_description: Persistent causal project memory for AI coding assistants
site_url: https://athammad.github.io/memoire
repo_url: https://github.com/athammad/memoire
repo_name: athammad/memoire
edit_uri: edit/master/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
    - Installation & Quick Start: quickstart.md
    - Provider Setup: providers.md
  - Reference:
    - Language Support: languages.md
    - MCP Tools: mcp.md
  - Deep Dive:
    - Theory & Design: theory.md
    - Benchmark: benchmark.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/athammad/memoire
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/memoire-ai
